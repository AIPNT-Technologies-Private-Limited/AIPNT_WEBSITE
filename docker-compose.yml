services:
  app:
    build:
      context: ./forntend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped