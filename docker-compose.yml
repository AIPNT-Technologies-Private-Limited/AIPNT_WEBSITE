version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - '5000'
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - EMAIL_TO=${EMAIL_TO}
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - '3000'
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:5000
    env_file:
      - path: ./frontend/.env
        required: false
    restart: unless-stopped
    depends_on:
      - backend
